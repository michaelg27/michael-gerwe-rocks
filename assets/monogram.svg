<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="MG monogram">
  <defs>
    <style>
      .ring { fill:none; stroke:#dca94c; stroke-width:1.4; }
      .ring2{ fill:none; stroke:#9bb8b6; stroke-width:0.9; }
      .tick { fill:none; stroke:#9bb8b6; stroke-width:1.1; }
      .mg   { fill:#f5ece0; font-family:"Cormorant Garamond", Georgia, serif; font-size:52px; font-weight:600; }
    </style>
  </defs>

  <!-- drafting compass rings -->
  <circle class="ring"  cx="60" cy="60" r="54"/>
  <circle class="ring2" cx="60" cy="60" r="47" stroke-dasharray="1 5"/>

  <!-- delicate cardinal serif ticks (inside the ring, not a crosshair) -->
  <line class="tick" x1="60" y1="6"   x2="60" y2="13"/>
  <line class="tick" x1="60" y1="107" x2="60" y2="114"/>
  <line class="tick" x1="6"  y1="60"  x2="13"  y2="60"/>
  <line class="tick" x1="107" y1="60" x2="114" y2="60"/>

  <!-- MG -->
  <text class="mg" x="60" y="77" text-anchor="middle">MG</text>
</svg>
