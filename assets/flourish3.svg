<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 40" width="600" height="40" role="img" aria-label="decorative flourish">
  <defs>
    <style>
      .s  { fill:none; stroke:#d9a441; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
      .sf { fill:none; stroke:#9bb8b6; stroke-width:0.7; opacity:0.5; }
      .f  { fill:#d9a441; }
    </style>
  </defs>
  <!-- center star -->
  <polygon class="f" points="300,9 302.6,16.4 310.5,16.6 304.2,21.4 306.5,28.9 300,24.4 293.5,28.9 295.8,21.4 289.5,16.6 297.4,16.4"/>
  <!-- left rule + chevron + faint trail -->
  <line class="s" x1="135" y1="20" x2="278" y2="20"/>
  <path class="s" d="M170 14 l-7 6 7 6"/>
  <circle class="f" cx="135" cy="20" r="2.2"/>
  <line class="sf" x1="152" y1="20" x2="278" y2="20"/>
  <!-- right rule + chevron + faint trail (mirror) -->
  <line class="s" x1="322" y1="20" x2="465" y2="20"/>
  <path class="s" d="M430 14 l7 6 -7 6"/>
  <circle class="f" cx="465" cy="20" r="2.2"/>
  <line class="sf" x1="322" y1="20" x2="448" y2="20"/>
</svg>
